<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 510" role="img" aria-labelledby="title desc">
  <title id="title">ArborKnowledge Studio — Architektur</title>
  <desc id="desc">Lokale Webanwendung: Quellen und Rechte, Wissenseinheiten und Provenienz, Suche, Redaktion, Export und Lernen. Menschliche Freigabe kontrolliert die Ausgaben.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#4b6b5b"/></marker></defs>
  <rect width="1500" height="510" rx="22" fill="#f3efe6"/>
  <text x="55" y="65" font-family="Georgia,serif" font-size="36" fill="#183d32">Architektur &amp; Kontrollpunkte</text>
  <text x="55" y="100" font-family="Arial,sans-serif" font-size="18" fill="#5c6b60">Local first · FastAPI / Jinja2 · SQLite · explizite Provenienz</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g fill="#ffffff" stroke="#abc1b2" stroke-width="2">
      <rect x="55" y="155" width="245" height="132" rx="15"/><rect x="342" y="155" width="245" height="132" rx="15"/>
      <rect x="629" y="155" width="245" height="132" rx="15"/><rect x="916" y="155" width="245" height="132" rx="15"/>
      <rect x="1203" y="155" width="245" height="132" rx="15"/>
    </g>
    <g fill="#183d32" font-size="22" font-weight="bold">
      <text x="177" y="199">Quellen</text><text x="464" y="199">Wissenseinheiten</text><text x="751" y="199">Suche</text>
      <text x="1038" y="199">Redaktion</text><text x="1325" y="199">Ausgabe</text>
    </g>
    <g fill="#53655a" font-size="16">
      <text x="177" y="232">Metadaten · Rechte</text><text x="177" y="258">Anhänge · Fundstellen</text>
      <text x="464" y="232">Aussagen · Typen</text><text x="464" y="258">Quellverweise</text>
      <text x="751" y="232">FTS5 · optional</text><text x="751" y="258">semantisch/hybrid</text>
      <text x="1038" y="232">Kapitel · Versionen</text><text x="1038" y="258">Kommentare · Freigabe</text>
      <text x="1325" y="232">DOCX · Backup</text><text x="1325" y="258">Kurse · Lernstand</text>
    </g>
  </g>
  <g stroke="#4b6b5b" stroke-width="3" marker-end="url(#arrow)">
    <path d="M304 221 H333"/><path d="M591 221 H620"/><path d="M878 221 H907"/><path d="M1165 221 H1194"/>
  </g>
  <path d="M465 305 V350 H1325 V305" fill="none" stroke="#a88c4e" stroke-width="3" stroke-dasharray="9 7"/>
  <rect x="285" y="365" width="930" height="95" rx="16" fill="#214b3d"/>
  <text x="750" y="401" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#fff">Menschliche Prüfung und Freigabe</text>
  <text x="750" y="432" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#dce8db">AI erstellt Vorschläge; Quellenbindung, Rechte und redaktionelle Entscheidung bleiben kontrolliert.</text>
</svg>
